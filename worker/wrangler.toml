# ===== Shajareh Worker config =====
name = "shajareh"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# SPA static assets built from the web workspace
[assets]
directory = "../web/dist"
not_found_handling = "single-page-application"

# Database (D1)
# Fill DATABASE_ID after `wrangler d1 create shajareh-db`.
[[d1_databases]]
binding = "DB"
database_name = "shajareh-db"
database_id = "fd1c559f-7aa6-4a2f-a875-716987711e95"
migrations_dir = "migrations"

# Sessions (KV)
[[kv_namespaces]]
binding = "SESSIONS"
id = "e4dc438f9c864b40abd05e778223f15e"

# Media storage (R2) — note: uncommented once you enable R2 in the dashboard and
# create the bucket with `wrangler r2 bucket create shajareh-media`.
# [[r2_buckets]]
# binding = "MEDIA"
# bucket_name = "shajareh-media"

# Workers AI
[ai]
binding = "AI"

[vars]
ENVIRONMENT = "development"
AI_PROVIDER = "rules"
AI_MODEL = "@cf/meta/llama-3.1-8b-instruct"